services:
  db:
    build: ./postgres
    container_name: postgres
    environment:
      POSTGRES_DB: asset_recommendation
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: 123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  server:
    build: ./server
    container_name: asset-recommendation-server
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_DB: asset_recommendation
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: 123
    ports:
      - "8000:8000"
    depends_on:
      - db

  kafka:
    image: apache/kafka:3.7.0
    container_name: kafka
    environment:
      # Required KRaft configuration
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093

      KAFKA_LOG_DIRS: /tmp/kraft-combined-logs
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'true'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
    ports:
      - "9092:9092"

  worker:
    build: ./kafka_worker
    container_name: asset-recommendation-worker
    environment:
      KAFKA_BROKER_URL: kafka:9092
      KAFKA_GROUP_ID: asset-reco-workers
      KAFKA_TOPICS: userprofile,retraining,interactions
      KAFKA_DLQ_TOPIC: events.dlq
      WORKER_MAX_RETRIES: "3"
      WORKER_CONCURRENCY: "4"
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      POSTGRES_DB: asset_recommendation
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: "123"

    depends_on:
      - kafka
      - db

  ui:
    build: ./ui
    container_name: asset-recommendation-ui
    ports:
      - "4200:80"
    depends_on:
      - server
    environment:
      - API_URL=http://localhost:8000

volumes:
  postgres_data:

